<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>图标预览</title>
<style>
  body { margin:0; display:flex; align-items:center; justify-content:center; gap:48px; height:100vh; background:#f2f4f8; font-family:sans-serif; }
  .card { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .label { color:#555; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <img src="parking-eye-icon.svg" width="200" height="200" alt="大尺寸">
    <div class="label">大尺寸 200px</div>
  </div>
  <div class="card">
    <img src="parking-eye-icon.svg" width="64" height="64" alt="中尺寸">
    <div class="label">中尺寸 64px</div>
  </div>
  <div class="card">
    <img src="parking-eye-icon.svg" width="32" height="32" alt="小尺寸">
    <div class="label">小尺寸 32px</div>
  </div>
  <div class="card">
    <img src="parking-eye-icon.svg" width="20" height="20" alt="极小尺寸">
    <div class="label">极小尺寸 20px</div>
  </div>
</body>
</html>
